<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrock Hub - Solo Bedrock</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; padding: 16px; padding-bottom: 40px; }
        header { text-align: center; margin-bottom: 20px; padding-top: 8px; }
        header h1 { color: #4caf50; font-size: 1.8rem; letter-spacing: 0.5px; }
        header p { font-size: 0.85rem; color: #888; margin-top: 4px; }

        .search-box { display: flex; gap: 8px; margin-bottom: 14px; }
        .search-box input {
            flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #333;
            background-color: #1e1e1e; color: #fff; font-size: 1rem; outline: none;
        }
        .search-box input:focus { border-color: #4caf50; }
        .search-box button {
            padding: 0 20px; background-color: #4caf50; color: #fff; border: none;
            border-radius: 10px; font-weight: bold; font-size: 0.95rem; cursor: pointer;
        }

        .filters { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 18px; padding-bottom: 4px; }
        .filter-btn {
            background-color: #1e1e1e; color: #bbb; border: 1px solid #333;
            padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; white-space: nowrap;
        }
        .filter-btn.active { background-color: #4caf50; color: #fff; border-color: #4caf50; font-weight: bold; }

        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
        .mod-card {
            background-color: #1e1e1e; border-radius: 12px; overflow: hidden;
            border: 1px solid #2c2c2c; cursor: pointer; display: flex; flex-direction: column;
        }
        .mod-card img { width: 100%; height: 120px; object-fit: cover; background-color: #252525; }
        .mod-info { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .mod-info h3 { font-size: 0.92rem; color: #fff; margin-bottom: 6px; line-height: 1.2; }
        .mod-info p {
            font-size: 0.78rem; color: #999; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px;
        }
        .mod-badge { font-size: 0.7rem; color: #4caf50; font-weight: bold; text-transform: uppercase; }

        .hidden { display: none !important; }
        #loading { text-align: center; padding: 30px; color: #4caf50; font-weight: bold; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); display: flex;
            justify-content: center; align-items: center; padding: 16px; z-index: 1000;
        }
        .modal-content {
            background-color: #1a1a1a; padding: 20px; border-radius: 14px;
            max-width: 440px; width: 100%; position: relative; border: 1px solid #333;
            max-height: 90vh; overflow-y: auto;
        }
        #closeModal {
            position: absolute; top: 12px; right: 16px; font-size: 1.8rem;
            cursor: pointer; color: #aaa; line-height: 1;
        }
        .modal-content img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; margin-bottom: 14px; }
        .modal-content h2 { font-size: 1.25rem; color: #fff; margin-bottom: 6px; }
        .modal-meta { font-size: 0.8rem; color: #4caf50; margin-bottom: 12px; }
        .modal-content p { font-size: 0.9rem; color: #ccc; line-height: 1.45; margin-bottom: 20px; }
        .download-btn {
            display: block; text-align: center; background-color: #4caf50; color: #fff;
            padding: 13px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bedrock Hub</h1>
        <p>Add-ons, texturas, shaders y mapas exclusivos para Bedrock</p>
    </header>

    <main>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar add-ons, shaders, texturas...">
            <button id="searchBtn">Buscar</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-type="all">Todo Bedrock</button>
            <button class="filter-btn" data-type="addon">Add-ons</button>
            <button class="filter-btn" data-type="texture">Texturas</button>
            <button class="filter-btn" data-type="shader">Shaders</button>
            <button class="filter-btn" data-type="map">Mapas</button>
        </div>

        <div id="loading" class="hidden">Filtrando contenido Bedrock...</div>
        <div id="resultsContainer" class="results-grid"></div>
    </main>

    <div id="detailModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeModal">&times;</span>
            <img id="modalImage" src="" alt="Vista previa">
            <h2 id="modalTitle"></h2>
            <div id="modalMeta" class="modal-meta"></div>
            <p id="modalDescription"></p>
            <a id="modalDownloadBtn" href="#" class="download-btn">Descargar Recurso Bedrock</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

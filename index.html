<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrock Hub - Buscador de Mods</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
</head>
<body>
    <header>
        <h1>⛏️ Bedrock Hub</h1>
        <p>Busca add-ons, texturas y mapas sin salir de la app</p>
    </header>

    <main>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Escribe el mod que buscas (ej. Shaders, Autos...)">
            <button id="searchBtn">Buscar</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-category="all">Todo</button>
            <button class="filter-btn" data-category="addon">Add-ons</button>
            <button class="filter-btn" data-category="texture">Texturas</button>
            <button class="filter-btn" data-category="map">Mapas</button>
        </div>

        <div id="loading" class="hidden">Buscando mods... 🔍</div>
        <div id="resultsContainer" class="results-grid"></div>
    </main>

    <!-- Modal para ver detalles y descarga directa sin salir -->
    <div id="detailModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeModal">&times;</span>
            <img id="modalImage" src="" alt="Mod Preview">
            <h2 id="modalTitle"></h2>
            <p id="modalDescription"></p>
            <a id="modalDownloadBtn" href="#" target="_blank" class="download-btn">Descargar Archivo Directo</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
